<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | ABRICIFE</title>

  <link rel="stylesheet" href="../css/login.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
  <script src="../js/login.js" defer></script>
</head>

<body>
  <main class="login-page">
    <section class="login-card">

      <div class="login-brand">
        <a href="index.html">
          <img src="../assets/img/logo.png" alt="Acolhe Recife">
        </a>
      </div>

      <div class="login-header">
        <div class="login-icon">
          <i class="fa-solid fa-building-columns"></i>
        </div>

        <h1>Área da Instituição</h1>
        <p>Entre com seus dados para acessar o painel.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              class="toggle-password"
              aria-label="Mostrar senha"
            >
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <p id="login-feedback" class="login-feedback" role="alert"></p>

        <button type="submit" class="btn-login">
          Entrar
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <p class="demo-text">
        Protótipo acadêmico — acesso demonstrativo.
      </p>

      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        Voltar para o início
      </a>

    </section>
  </main>
</body>
</html>
